# Netlify configuration for the flu-harness landing page.
#
# Next.js App Router, so Netlify builds it with the Next.js Runtime rather than
# serving a static folder. The page prerenders to static HTML either way, but
# going through the runtime keeps `next/image`, route handlers and future
# server-side work available without a config change.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9 or newer. Pinned to 22 LTS rather than "latest"
  # so a Netlify default change cannot break a deploy that used to work.
  NODE_VERSION = "22"

# Headers are deliberately NOT declared here. On Netlify, header rules in this
# file are applied by the CDN, and they do not reach HTML that the Next.js
# runtime serves from a function: measured on the deployed site, static assets
# received every rule while the page itself and the 404 carried only the nosniff
# that Next.js sets on its own. X-Frame-Options and Referrer-Policy were missing
# from every page while this block was here.
#
# They live in next.config.ts instead, so they travel with the app rather than
# with the host and keep working on Vercel, Cloudflare or a Node server.

# Deploy previews and branch deploys are useful for a landing page; keep them.
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
